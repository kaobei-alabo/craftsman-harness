[workspace]
resolver = "2"
members = [
    "crates/craftsman-rs",
    "crates/craftsman-harness",
    "crates/craftsman-gadget",
    "crates/craftsman-gadget-macros",
]

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-std", "io-util", "signal", "sync", "net", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
