name: service-agent-image
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Post-migration Craftsman CLI release tag with current asset names
        required: true
      image_tag:
        description: OCI image tag
        required: true
  release:
    types: [published]
permissions:
  contents: read
  packages: write
concurrency:
  group: service-agent-image-${{ github.event.release.tag_name || inputs.image_tag }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          IMAGE_TAG: ${{ github.event.release.tag_name || inputs.image_tag }}
        run: |
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
      - name: Download checksum-verified release inputs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          gh release download "$RELEASE_TAG" \
            --pattern craftsman-linux-x86_64 \
            --pattern craftsman-linux-arm64 \
            --pattern SHA256SUMS
          grep '  craftsman-linux-x86_64$' SHA256SUMS | sha256sum --check -
          grep '  craftsman-linux-arm64$' SHA256SUMS | sha256sum --check -
          chmod 0555 craftsman-linux-x86_64 craftsman-linux-arm64
      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Enable multi-arch builds
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install amd64,arm64
          docker buildx create --name craftsman-service-agent --use
      - name: Build and publish
        env:
          IMAGE_TAG: ${{ steps.version.outputs.image_tag }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/craftsman-harness-service-agent:${IMAGE_TAG}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file docker/service-agent.Dockerfile \
            --tag "$image" \
            --push .
          docker buildx imagetools inspect "$image"
