[package]
name = "privacy-detector-fixture"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]

[dependencies]
craftsman-gadget = { path = "../../../../craftsman-gadget" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
